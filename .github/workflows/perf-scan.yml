name: Performance scan

on:
  push:
    branches: [perf-real-20260924]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - run: ./gradlew :core:jmhJar --no-daemon -x compileTestScala -x compileTestJava
      - name: Run SHA-256 pool benchmark
        run: |
          cat > /tmp/PoolBench.java <<'EOF'
          package net.i2p.crypto;
          import net.i2p.I2PAppContext;
          public class PoolBench {
            public static void main(String[] a) {
              SHA256Generator s=I2PAppContext.getGlobalContext().sha();
              byte[] in=new byte[40], out=new byte[32];
              for(int i=0;i<1000;i++) s.calculateHash(in,0,in.length,out,0);
              long t=System.nanoTime();
              for(int i=0;i<50000;i++) {
                for(int j=0;j<1000;j++) s.calculateHash(in,0,in.length,out,0);
              }
              System.out.printf("%.3f ns/op%n",(System.nanoTime()-t)/50000.0);
            }
          }
          EOF
          git fetch --no-tags --depth=1 origin master
          git checkout --force master
          ./gradlew :core:classes --no-daemon -x compileTestScala -x compileTestJava
          javac -cp core/build/classes/java/main -d /tmp /tmp/PoolBench.java
          echo "=== master ==="
          java -cp /tmp:core/build/classes/java/main net.i2p.crypto.PoolBench
          git checkout --force "$GITHUB_SHA"
          ./gradlew :core:classes --no-daemon -x compileTestScala -x compileTestJava
          javac -cp core/build/classes/java/main -d /tmp /tmp/PoolBench.java
          echo "=== candidate ==="
          java -cp /tmp:core/build/classes/java/main net.i2p.crypto.PoolBench
      - uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: /tmp/results.txt
