name: Performance experiment

on:
  push:
    branches:
      - perf-loop-20260924

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build JMH jar
        run: ./gradlew :core:jmhJar --no-daemon
      - name: Run PBE JMH benchmark
        run: java -jar core/build/libs/core-jmh.jar CoreFeatureBench.pbeSessionKey -f 3 -wi 3 -i 5 -tu ns
