name: Performance experiment

on:
  push:
    branches:
      - perf-loop-20260924

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run PBE JMH benchmark
        run: ./gradlew :core:jmh --no-daemon -Pjmh.includes=CoreFeatureBench.pbeSessionKey -Pjmh.forks=3 -Pjmh.warmupIterations=3 -Pjmh.iterations=5
