name: perf-smallest-result
on:
  push:
    branches:
      - perf-smallest-20260924
    paths-ignore:
      - perf-result.txt
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Benchmark candidate
        run: |
          ./gradlew :core:jmhJar --no-daemon
          java -jar core/build/libs/*jmh.jar 'net.i2p.CoreFeatureBench.integerDecode' -wi 5 -i 7 -f 3 | tee candidate.txt
      - name: Benchmark master
        run: |
          git worktree add ../master-work origin/master
          cd ../master-work
          ./gradlew :core:jmhJar --no-daemon
          java -jar core/build/libs/*jmh.jar 'net.i2p.CoreFeatureBench.integerDecode' -wi 5 -i 7 -f 3 | tee ../master.txt
      - name: Commit result
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "Candidate"
            tail -n 20 candidate.txt
            echo
            echo "Master"
            tail -n 20 ../master.txt
          } > perf-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add perf-result.txt
          git commit -m "Record smallest benchmark result"
          git push
