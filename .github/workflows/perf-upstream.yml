name: perf-upstream
on:
  push:
    branches:
      - perf-upstream-20260924
    paths-ignore:
      - core/java/bench/net/i2p/NonceTidyBench.java
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :core:jmhJar --no-daemon
      - run: java -jar core/build/libs/*jmh.jar 'net.i2p.NonceTidyBench' -wi 3 -i 5 -f 3 | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nonce-bench
          path: result.txt
