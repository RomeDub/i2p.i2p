name: perf-smallest
on:
  push:
    branches:
      - perf-real-20260924
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Benchmark candidate
        run: |
          ./gradlew :core:jmhJar --no-daemon
          java -jar core/build/libs/*jmh.jar 'net.i2p.CoreFeatureBench.(integerDecode|integerEncode)' -wi 5 -i 5 -f 2 | tee candidate.txt
      - name: Benchmark master
        run: |
          git worktree add ../master-work origin/master
          cd ../master-work
          ./gradlew :core:jmhJar --no-daemon
          java -jar core/build/libs/*jmh.jar 'net.i2p.CoreFeatureBench.(integerDecode|integerEncode)' -wi 5 -i 5 -f 2 | tee ../master.txt
          cd -
      - name: Publish results
        run: |
          echo '### Candidate' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'CoreFeatureBench.(integerDecode|integerEncode).*AverageTime' candidate.txt || true
          tail -n 20 candidate.txt >> "$GITHUB_STEP_SUMMARY"
          echo '### Master' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 ../master.txt >> "$GITHUB_STEP_SUMMARY"
